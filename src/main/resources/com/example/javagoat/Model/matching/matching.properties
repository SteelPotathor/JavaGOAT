# ---------------------------------------------------------------------------------------------
# JavaGOAT - matching settings (default values)
#
# To change them without touching the code, copy the keys you want to change into
# data/matching.properties (next to profiles.json) and restart the application.
# An unknown key or an invalid value stops the application with an explicit message.
#
# How the score works
#   For a person A and a candidate B, every criterion of A's preferences gives a satisfaction
#   between 0 and 1. A's satisfaction with B is the weighted average of these values, where the
#   weight of a criterion = weight.<criterion> x importance.<level chosen by A>.
#   Criteria marked INDIFFERENT by A are ignored. A REQUIRED criterion that is not fully
#   satisfied (or a sex that A does not accept) eliminates B.
#   The common passions are always taken into account with weight.passions.
#   The compatibility shown and used for ranking is the geometric mean of the satisfaction of
#   A with B and of B with A: both people must like the other one.
# ---------------------------------------------------------------------------------------------

# Relative weight of each criterion (0 disables it)
weight.age=3
weight.size=1.5
weight.iq=1
weight.hairColor=0.5
weight.hairType=0.5
weight.hairLength=0.5
weight.ethnicity=1
weight.bodyBuild=1
weight.smoker=2
weight.alcohol=1
weight.athlete=1
weight.feed=1.5
weight.religion=2
# Common passions (video games + other passions), similarity = common / sqrt(countA x countB)
weight.passions=5

# Multiplier applied to the weight of a criterion according to the importance chosen by the person
importance.NICE_TO_HAVE=1
importance.IMPORTANT=3
importance.REQUIRED=3

# Outside a range, the satisfaction falls linearly from 1 to 0 over this distance
# (years, centimetres, IQ points)
tolerance.age=5
tolerance.size=10
tolerance.iq=15

# Ordered criteria (smoker, alcohol, athlete, body build, hair length, hair type, feed):
# satisfaction lost for each step away from the nearest accepted value (between 0 and 1)
ordinal.stepPenalty=0.5
